name: Release Linux package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set application version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export RELEASE_VERSION="${RELEASE_TAG#v}"
          # `npm version` fails with "Version not changed" when the committed
          # version already matches the tag, which is the normal case for a
          # release cut straight from a prepared tree.
          if [ "$(node -p "require('./package.json').version")" != "$RELEASE_VERSION" ]; then
            npm version "$RELEASE_VERSION" --no-git-tag-version
          fi
          node -e "const fs=require('fs'); const p='src-tauri/tauri.conf.json'; const c=JSON.parse(fs.readFileSync(p, 'utf8')); c.version=process.env.RELEASE_VERSION; fs.writeFileSync(p, JSON.stringify(c, null, 2)+'\n');"
          sed -i "s/^version = \".*\"/version = \"$RELEASE_VERSION\"/" src-tauri/Cargo.toml

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run JavaScript tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Debian package
        run: npm run dist

      - name: Create GitHub Release and upload package
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: src-tauri/target/release/bundle/deb/*.deb
