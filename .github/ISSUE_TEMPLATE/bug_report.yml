name: Bug report
description: Report a problem with Veyrilo
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include security-sensitive details here. Use the process in
        [SECURITY.md](https://github.com/Utkucan-W/veyrilo-markdown-editor/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Veyrilo version
      description: Settings → About, or the installed package version.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Linux distribution and version
      placeholder: "Ubuntu 24.04 / Fedora 40 / Arch"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, console output, or anything else that helps.
    validations:
      required: false
